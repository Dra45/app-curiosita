name: Generate Daily Curiosity

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Curiosity with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const apiKey = process.env.GEMINI_API_KEY;

          const prompt = `Genera una curiosità affascinante, insolita e dettagliata su un argomento qualsiasi (scienza, storia, natura, tecnologia, misteri o aneddoti bizzarri). 
          Rispondi ESCLUSIVAMENTE con un oggetto JSON valido (senza formattazione markdown o blocchi di codice \`\`\`json) strutturato esattamente così:
          {
            "titolo": "Un titolo accattivante e d impatto sulla curiosità",
            "spiegazione": "Una spiegazione approfondita, ricca di dettagli affascinanti, contesto storico o scientifico, scritta in modo coinvolgente."
          }`;

          async function main() {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              });
              const data = await res.json();
              
              if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                console.error("Risposta non valida dall API:", JSON.stringify(data));
                process.exit(1);
              }

              let text = data.candidates[0].content.parts[0].text;
              text = text.replace(/```json/g, "").replace(/```/g, "").trim();

              fs.writeFileSync("curiosita.json", text);
              console.log("Curiosità casuale dettagliata generata con successo!");
            } catch (err) {
              console.error("Errore durante la generazione:", err);
              process.exit(1);
            }
          }
          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add curiosita.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Aggiornamento curiosità casuale dettagliata" && git push)
