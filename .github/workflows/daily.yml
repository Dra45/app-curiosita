name: Generate Daily Curiosity

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Fondamentale per permettere al bot di fare il commit e il push automatico
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Curiosity with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const apiKey = process.env.GEMINI_API_KEY;

          const prompt = `Genera una curiosità affascinante, insolita e dettagliata su un argomento qualsiasi (scienza, storia, natura, tecnologia, misteri o aneddoti bizzarri). 
          IMPORTANTE: Rispondi ESCLUSIVAMENTE con un oggetto JSON valido, senza inserire blocchi di codice markdown (come \`\`\`json) e senza alcun testo prima o dopo. La struttura deve essere esattamente questa:
          {
            "titolo": "Un titolo accattivante e d impatto sulla curiosità",
            "spiegazione": "Una spiegazione approfondita, ricca di dettagli affascinanti, contesto storico o scientifico, scritta in modo coinvolgente."
          }`;

          async function main() {
            try {
              // Usiamo un alias stabile e sicuro per evitare errori di versione del modello
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: {
                    responseMimeType: "application/json" // Forza l API a restituire JSON puro
                  }
                })
              });
              const data = await res.json();
              
              if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                console.error("Risposta non valida dall API:", JSON.stringify(data));
                process.exit(1);
              }

              let text = data.candidates[0].content.parts[0].text;
              
              // Pulizia di sicurezza avanzata in caso l intelligenza artificiale includa markdown
              text = text.replace(/```json/gi, "").replace(/```/g, "").trim();
              
              // Validazione preliminare per assicurarci che sia un JSON corretto prima di scriverlo
              JSON.parse(text);

              fs.writeFileSync("curiosita.json", text);
              console.log("Curiosità casuale dettagliata generata con successo!");
            } catch (err) {
              console.error("Errore durante la generazione o parsing del JSON:", err);
              process.exit(1);
            }
          }
          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add curiosita.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Aggiornamento automatico curiosità giornaliera" && git push)
