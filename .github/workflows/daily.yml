name: Genera Curiosita Giornaliera

on:
  schedule:
    # Esegue lo script ogni giorno alle 06:00 UTC (08:00 italiane)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette di avviare l'azione anche manualmente da GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Esegui script Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate.js

      - name: Salva e fai Push del nuovo JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add curiosita.json
          git commit -m "Aggiornata curiosità del giorno [auto]" || exit 0
          git push
