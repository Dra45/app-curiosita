name: Aggiorna Almanacco e Push OneSignal

on:
  schedule:
    - cron: '50 4 * * *' # Alle 6:50 ora italiana (4:50 UTC)
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  genera_e_notifica:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui script e invio OneSignal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: |
          python - << 'EOF'
          import os, json, datetime, requests

          api_key = os.environ.get("GEMINI_API_KEY")
          os_app_id = os.environ.get("ONESIGNAL_APP_ID")
          os_api_key = os.environ.get("ONESIGNAL_REST_KEY")

          if not api_key:
              print("Errore: GEMINI_API_KEY mancante.")
              exit(1)

          oggi = datetime.datetime.now()
          ieri = oggi - datetime.timedelta(days=1)
          date_da_generare = [oggi, ieri]

          db = {}
          if os.path.exists("almanacco.json"):
              try:
                  with open("almanacco.json", "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content:
                          db = json.loads(content)
              except Exception as e:
                  print(f"File JSON esistente ignorato: {e}")

          # Generazione dati con Gemini
          for dt in date_da_generare:
              mm_gg = dt.strftime("%m-%d")
              data_str = dt.strftime("%d %B %Y")
              print(f"Richiesta almanacco per: {data_str} ({mm_gg})")
              
              prompt = f"Fornisci l'almanacco in italiano per la data {data_str}. Rispondi ESCLUSIVAMENTE in formato JSON valido, senza blocchi di codice markdown, con questa struttura esatta: {{\"santo\": \"Nome del santo o dei santi del giorno con breve descrizione\", \"ricorrenze\": \"Eventuali ricorrenze o giornate mondiali\", \"storia\": [\"Anno - Evento 1\", \"Anno - Evento 2\", \"Anno - Evento 3\", \"Anno - Evento 4\"]}}"
              
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=" + api_key
              
              try:
                  res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]})
                  if res.status_code == 200:
                      risposta_json = res.json()
                      testo = risposta_json["candidates"][0]["content"]["parts"][0]["text"]
                      testo = testo.replace("```json", "").replace("```", "").strip()
                      db[mm_gg] = json.loads(testo)
                      print(f"✅ Generato per {mm_gg}")
              except Exception as e:
                  print(f"❌ Errore per {mm_gg}: {e}")

          # Salva il file JSON aggiornato
          with open("almanacco.json", "w", encoding="utf-8") as f:
              json.dump(db, f, ensure_ascii=False, indent=2)

          # Invio Notifica Push tramite OneSignal per OGGI
          if os_app_id and os_api_key:
              oggi_mm_gg = oggi.strftime("%m-%d")
              dati_oggi = db.get(oggi_mm_gg, {})
              
              santo = dati_oggi.get("santo", "Nuovo Santo del giorno")
              
              titolo = "📣 Scopri la nuova curiosità di oggi! 😍"
              testo_notifica = f"Il nuovo Almanacco di oggi è pronto! Santo: {santo}. Clicca per leggerlo 📅"

              onesignal_url = "https://onesignal.com/api/v1/notifications"
              headers = {
                  "Authorization": f"Basic {os_api_key}",
                  "Content-Type": "application/json; charset=utf-8"
              }
              payload = {
                  "app_id": os_app_id,
                  "included_segments": ["All"],
                  "headings": {"it": titolo},
                  "contents": {"it": testo_notifica}
              }
              
              resp = requests.post(onesignal_url, headers=headers, json=payload)
              if resp.status_code == 200:
                  print("📲 Notifica OneSignal inviata con successo!")
              else:
                  print(f"❌ Errore invio OneSignal: {resp.text}")
          EOF

      - name: Salva e carica su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add almanacco.json
          git commit -m "Aggiornamento almanacco e invio push OneSignal" || echo "Nessuna modifica"
          git push
