name: Aggiorna Almanacco e Push OneSignal

on:
  schedule:
    # Esegue l'azione alle 22:00 UTC, che corrisponde esattamente alle 00:00 in Italia
    - cron: '0 22 * * *'
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  genera_e_notifica:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui script e invio OneSignal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: |
          python - << 'EOF'
          import os, json, datetime, requests, time
          from zoneinfo import ZoneInfo

          api_key = os.environ.get("GEMINI_API_KEY")
          os_app_id = os.environ.get("ONESIGNAL_APP_ID")
          os_api_key = os.environ.get("ONESIGNAL_REST_KEY")

          if not api_key:
              print("Errore: GEMINI_API_KEY mancante.")
              exit(1)

          # Imposta rigorosamente il fuso orario italiano (Roma)
          tz_roma = ZoneInfo("Europe/Rome")
          oggi = datetime.datetime.now(tz_roma)
          mm_gg = oggi.strftime("%m-%d")
          data_str = oggi.strftime("%d %B %Y")

          db = {}
          if os.path.exists("almanacco.json"):
              try:
                  with open("almanacco.json", "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content:
                          db = json.loads(content)
              except Exception as e:
                  print(f"File JSON esistente ignorato: {e}")

          # Genera SOLO la data di oggi per evitare di superare la quota giornaliera (Errore 429)
          print(f"Richiesta almanacco per oggi: {data_str} ({mm_gg})")
          
          prompt = f"Fornisci l'almanacco in italiano per la data {data_str}. Rispondi ESCLUSIVAMENTE in formato JSON valido, senza blocchi di codice markdown, con questa struttura esatta: {{\"santo\": \"Nome del santo o dei santi del giorno con breve descrizione\", \"ricorrenze\": \"Eventuali ricorrenze o giornate mondiali\", \"storia\": [\"Anno - Evento 1\", \"Anno - Evento 2\", \"Anno - Evento 3\", \"Anno - Evento 4\"]}}"
          
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=" + api_key
          
          successo = False
          for tentativo in range(3):
              try:
                  res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]})
                  if res.status_code == 200:
                      risposta_json = res.json()
                      testo = risposta_json["candidates"][0]["content"]["parts"][0]["text"]
                      testo = testo.replace("```json", "").replace("```", "").strip()
                      db[mm_gg] = json.loads(testo)
                      print(f"✅ Generato con successo per {mm_gg}")
                      successo = True
                      break
                  elif res.status_code == 429:
                      print(f"⚠️ Quota superata (429), tentativo {tentativo+1}/3. Attendo 30 secondi...")
                      time.sleep(30)
                  else:
                      print(f"❌ Errore API per {mm_gg}: {res.text}")
                      break
              except Exception as e:
                  print(f"❌ Errore di rete: {e}")
                  break

          # Salva il file JSON aggiornato
          with open("almanacco.json", "w", encoding="utf-8") as f:
              json.dump(db, f, ensure_ascii=False, indent=2)

          # Invio Notifica Push tramite OneSignal per OGGI
          if os_app_id and os_api_key and successo:
              dati_oggi = db.get(mm_gg, {})
              santo = dati_oggi.get("santo", "Santo del giorno")
              
              titolo = "Scopri il nuovo Almanacco"
              testo_notifica = f"L'Almanacco di oggi è pronto! Santo: {santo}. Clicca per leggerlo 📅"

              onesignal_url = "https://onesignal.com/api/v1/notifications"
              headers = {
                  "Authorization": f"Basic {os_api_key}",
                  "Content-Type": "application/json; charset=utf-8"
              }
              payload = {
                  "app_id": os_app_id,
                  "included_segments": ["All"],
                  "headings": {
                      "en": titolo,
                      "it": titolo
                  },
                  "contents": {
                      "en": testo_notifica,
                      "it": testo_notifica
                  }
              }
              
              resp = requests.post(onesignal_url, headers=headers, json=payload)
              if resp.status_code == 200:
                  print("📲 Notifica OneSignal inviata con successo!")
              else:
                  print(f"❌ Errore invio OneSignal: {resp.text}")
          EOF

      - name: Salva e carica su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase || true
          git add almanacco.json
          git commit -m "Aggiornamento almanacco e invio push OneSignal" || echo "Nessuna modifica"
          git push origin main
