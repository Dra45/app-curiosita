name: Aggiorna Quiz Giornaliero

on:
  schedule:
    - cron: '0 6 * * *'  # Si attiva ogni giorno alle 06:00 UTC
    - cron: '0 12 * * *' # Secondo controllo di sicurezza a mezzogiorno UTC (anti-fallimento)
  workflow_dispatch:     # Permette l'avvio manuale se vuoi testarlo subito
  push:
    branches:
      - main
      - master

jobs:
  update-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Fondamentale per dare i permessi di scrittura al bot
    steps:
      - name: Clona Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Libreria Google GenAI
        run: pip install google-genai

      - name: Esegui Script Generazione Quiz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python genera_quiz.py

      - name: Commit e Push delle modifiche su quiz.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz.json
          
          # Se per qualsiasi motivo il file non ha variazioni, forza un timestamp invisibile 
          # per impedire a GitHub di considerare il repo "morto" e spegnere i cron automatici
          if git diff --staged --quiet; then
            echo "Nessuna variazione rilevata, forzatura timestamp di riserva..."
            echo "<!-- Aggiornato il $(date) -->" >> quiz.json
            git add quiz.json
          fi
          
          git commit -m "🤖 Aggiornamento automatico Quiz del giorno [skip ci]" || echo "Nessuna modifica da committare"
          git push
