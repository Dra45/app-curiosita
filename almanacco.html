<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almanacco del Giorno</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --accent-color: #a78bfa;
      --btn-bg: #8b5cf6;
      --btn-active: #7c3aed;
      --meme-btn-bg: #334155;
    }

    body.pink-theme {
      --bg-color: #2a0f1d;
      --card-bg: #3b1e2e;
      --border-color: #553346;
      --text-main: #fcf8fa;
      --text-sub: #e1cbd7;
      --accent-color: #f472b6;
      --btn-bg: #ec4899;
      --btn-active: #db2777;
      --meme-btn-bg: #553346;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      transition: background-color 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      text-align: left;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    h1 { font-size: 1.4rem; color: var(--accent-color); margin-top: 0; text-align: center; }
    h3 { font-size: 0.95rem; color: var(--accent-color); margin-top: 18px; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    p { font-size: 0.9rem; line-height: 1.5; color: var(--text-sub); margin: 4px 0; }

    .day-selector {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 20px;
    }

    .day-btn {
      flex: 1;
      padding: 10px;
      background: var(--meme-btn-bg);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background-color 0.3s ease;
      text-align: center;
    }

    .day-btn.active {
      background: var(--btn-bg);
      border-color: var(--accent-color);
    }

    ul { padding-left: 20px; margin: 4px 0 12px 0; }
    li { margin-bottom: 6px; line-height: 1.4; font-size: 0.88rem; color: var(--text-sub); }

    .btn-back {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      text-align: center;
      transition: background-color 0.3s ease;
    }
    .btn-back:hover { background-color: var(--meme-btn-bg); color: var(--text-main); }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="titolo-data">🗓️ Almanacco del Giorno</h1>

    <div class="day-selector">
      <button id="btn-ieri" class="day-btn" onclick="caricaAlmanacco('ieri')">⬅️ Ieri</button>
      <button id="btn-oggi" class="day-btn active" onclick="caricaAlmanacco('oggi')">📌 Oggi</button>
    </div>

    <div id="contenuto">
      <p style="text-align: center;">⏳ Caricamento almanacco...</p>
    </div>

    <button class="btn-back" onclick="window.location.href='index.html'">⬅️ Torna alla Home</button>
  </div>

  <script>
    async function caricaAlmanacco(tipo) {
      document.getElementById('btn-ieri').classList.toggle('active', tipo === 'ieri');
      document.getElementById('btn-oggi').classList.toggle('active', tipo === 'oggi');

      let dt = new Date();
      if (tipo === 'ieri') dt.setDate(dt.getDate() - 1);

      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const gg = String(dt.getDate()).padStart(2, '0');
      const dataKey = `${mm}-${gg}`;

      const opzioni = { day: 'numeric', month: 'long' };
      document.getElementById('titolo-data').innerText = `🗓️ ${dt.toLocaleDateString('it-IT', opzioni)}`;
      
      const div = document.getElementById('contenuto');
      div.innerHTML = "<p style='text-align: center;'>⏳ Sintonizzazione con l'almanacco...</p>";

      try {
        const res = await fetch('almanacco.json?t=' + new Date().getTime());
        const db = await res.json();
        
        const oggiDati = db[dataKey] || Object.values(db)[0] || {
          santo: "Informazione in fase di sincronizzazione...",
          ricorrenze: "Nessuna ricorrenza registrata.",
          storia: ["Eventi in caricamento..."]
        };

        let html = `
          <h3>✝️ Santo del Giorno</h3>
          <p>${oggiDati.santo}</p>

          <h3>🌍 Giornata / Ricorrenza</h3>
          <p>${oggiDati.ricorrenze}</p>

          <h3>📜 Accadde Oggi</h3>
          <ul>
        `;

        if (Array.isArray(oggiDati.storia)) {
          oggiDati.storia.forEach(item => {
            html += `<li>${item}</li>`;
          });
        } else {
          html += `<li>${oggiDati.storia}</li>`;
        }

        html += `</ul>`;
        div.innerHTML = html;

      } catch (err) {
        div.innerHTML = "<p style='text-align: center;'>❌ Impossibile caricare i dati dell'almanacco. Assicurati che il file almanacco.json esista nel repository.</p>";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'pink') document.body.classList.add('pink-theme');
      caricaAlmanacco('oggi');
    });
  </script>

</body>
</html>
