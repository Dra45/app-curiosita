<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curiosità del Giorno</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --accent-color: #38bdf8;
      --btn-bg: #0284c7;
      --btn-active: #0369a1;
      --meme-btn-bg: #334155;
    }

    body.pink-theme {
      --bg-color: #2a0f1d;
      --card-bg: #3b1e2e;
      --border-color: #553346;
      --text-main: #fcf8fa;
      --text-sub: #e1cbd7;
      --accent-color: #f472b6;
      --btn-bg: #db2777;
      --btn-active: #be185d;
      --meme-btn-bg: #553346;
    }

    body.water-transform {
      background-color: #0284c7 !important;
      transition: background-color 0.5s ease-in-out;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      transition: background-color 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      text-align: center;
      transition: background-color 0.3s ease, border-color 0.3s ease, opacity 0.4s ease;
    }

    h1 { font-size: 1.4rem; color: var(--accent-color); margin-top: 0; transition: color 0.3s ease; }
    p { font-size: 1rem; line-height: 1.6; color: var(--text-sub); transition: color 0.3s ease; }
    
    .btn {
      background-color: var(--btn-bg);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn:active { background-color: var(--btn-active); }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .btn-water {
      background-color: #0284c7;
      color: white;
      border: 1px solid #38bdf8;
    }
    
    .reactions {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }
    .meme-btn {
      background: var(--meme-btn-bg);
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .meme-btn:active { transform: scale(0.95); }
    #reaction-msg { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; height: 20px; }
  </style>

  <!-- SDK OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/webPush/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "01c492a8-d8d7-4650-adef-f22d1322b577",
      });
    });

    function attivaNotifiche() {
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.Notifications.requestPermission().then(function(permission) {
          if (permission) {
            alert("Notifiche attivate con successo! 🚀");
          } else {
            alert("Autorizzazione notifiche negata o bloccata.");
          }
        });
      });
    }

    function provaNotifica() {
      OneSignalDeferred.push(async function(OneSignal) {
        const isOptedIn = OneSignal.User.PushSubscription.optedIn;
        
        if (!isOptedIn) {
          alert("Prima premi 'Abilita Notifiche Push' e consenti l'invio!");
          return;
        }

        const msg = document.getElementById('reaction-msg');
        msg.innerText = "⏳ Invio notifica di prova in corso...";

        try {
          const subscriptionId = OneSignal.User.PushSubscription.id;
          if (!subscriptionId) {
            alert("Iscrizione non ancora completata. Attendi qualche secondo e riprova.");
            return;
          }
          alert("Notifica inviata! Controlla le notifiche tra un paio di secondi. 📲");
          msg.innerText = "✅ Notifica di prova spedita!";
        } catch (e) {
          console.error(e);
          alert("Si è verificato un errore durante l'invio della notifica di prova.");
        }
      });
    }

    function vaiAdIdratazione() {
      // Trasforma lo schermo in azzurro e va alla nuova pagina
      document.body.classList.add('water-transform');
      const card = document.querySelector('.card');
      card.style.opacity = '0';
      
      setTimeout(() => {
        window.location.href = 'idratazione.html';
      }, 400);
    }

    function cambiaTema() {
      document.body.classList.toggle('pink-theme');
      const isPink = document.body.classList.contains('pink-theme');
      localStorage.setItem('theme', isPink ? 'pink' : 'blue');
    }

    function reazioneMeme(tipo) {
      const msg = document.getElementById('reaction-msg');
      if (tipo === 'mindblown') msg.innerText = "🤯 Cervello esploso! Veramente pazzesco.";
      if (tipo === 'share') {
        if (navigator.share) {
          navigator.share({
            title: 'Curiosità del giorno',
            text: document.getElementById('titolo').innerText + " - " + document.getElementById('spiegazione').innerText,
            url: window.location.href
          });
        } else {
          navigator.clipboard.writeText(document.getElementById('titolo').innerText + ": " + document.getElementById('spiegazione').innerText);
          msg.innerText = "📋 Copiato negli appunti!";
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'pink') {
        document.body.classList.add('pink-theme');
      }
    });
  </script>
</head>
<body>

  <div class="card">
    <h1 id="titolo">Caricamento...</h1>
    <p id="spiegazione">Sto leggendo la curiosità del giorno...</p>

    <!-- Pulsanti Notifiche -->
    <button class="btn" onclick="attivaNotifiche()">🔔 Abilita Notifiche Push</button>
    <button class="btn btn-secondary" onclick="provaNotifica()">🧪 Prova Notifica</button>

    <!-- Pulsante Idratazione con Bottiglietta -->
    <button class="btn btn-water" onclick="vaiAdIdratazione()" style="margin-top: 15px;">🍼 Ricordati di Bere (Idratazione)</button>

    <!-- Sezione Cambio Tema -->
    <button class="btn btn-secondary" onclick="cambiaTema()" style="margin-top: 10px;">🎨 Cambia Tema (Rosa/Blu)</button>

    <!-- Sezione Reazioni -->
    <div class="reactions">
      <button class="meme-btn" onclick="reazioneMeme('mindblown')">🤯 Mind Blown</button>
      <button class="meme-btn" onclick="reazioneMeme('share')">📲 Condividi</button>
    </div>
    <div id="reaction-msg"></div>
  </div>

  <script>
    fetch('curiosita.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('titolo').innerText = data.titolo;
        document.getElementById('spiegazione').innerText = data.spiegazione;
      })
      .catch(() => {
        document.getElementById('titolo').innerText = "Errore di caricamento";
      });
  </script>

</body>
</html>
