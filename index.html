<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curiosità del Giorno</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #58a6ff; font-size: 1.5rem; margin-top: 0; }
    p { line-height: 1.6; color: #c9d1d9; font-size: 1.05rem; }
    button {
      background-color: #238636;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💡 Curiosità del Giorno</h1>
    <p id="testo-curiosita">Caricamento in corso...</p>
    <button onclick="richiediNotifiche()">🔔 Attiva Notifiche</button>
  </div>

  <script>
    // Registra il Service Worker per le notifiche/PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Carica la curiosità (per ora un esempio fisso, poi la collegheremo all'IA)
    document.getElementById('testo-curiosita').innerText = 
      "Sapevi che il miele non scade mai? Gli archeologi hanno trovato barattoli di miele nelle tombe egizie risalenti a oltre 3.000 anni fa ancora perfettamente edibili.";

    async function richiediNotifiche() {
      if (!('Notification' in window)) {
        alert('Le notifiche non sono supportate su questo browser.');
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        alert('Notifiche attivate con successo!');
      } else {
        alert('Permesso per le notifiche negato.');
      }
    }
  </script>
</body>
</html>
