<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curiosità del Giorno</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
      text-align: center;
    }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-top: 0; }
    p { font-size: 1rem; line-height: 1.6; color: #cbd5e1; }
    
    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn:active { background-color: #0369a1; }
    
    .reactions {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }
    .meme-btn {
      background: #334155;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .meme-btn:active { transform: scale(0.95); }
    #reaction-msg { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; height: 20px; }
  </style>

  <!-- SDK OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/webPush/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "01c492a8-d8d7-4650-adef-f22d1322b577",
      });
    });

    function attivaNotifiche() {
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.Notifications.requestPermission().then(function(permission) {
          if (permission) {
            alert("Notifiche attivate con successo! 🚀");
          } else {
            alert("Autorizzazione notifiche negata o bloccata.");
          }
        });
      });
    }

    function reazioneMeme(tipo) {
      const msg = document.getElementById('reaction-msg');
      if (tipo === 'mindblown') msg.innerText = "🤯 Cervello esploso! Veramente pazzesco.";
      if (tipo === 'doubt') msg.innerText = "🤨 Mmm... Gemini sta allucinando o è vero?";
      if (tipo === 'share') {
        if (navigator.share) {
          navigator.share({
            title: 'Curiosità del giorno',
            text: document.getElementById('titolo').innerText + " - " + document.getElementById('spiegazione').innerText,
            url: window.location.href
          });
        } else {
          navigator.clipboard.writeText(document.getElementById('titolo').innerText + ": " + document.getElementById('spiegazione').innerText);
          msg.innerText = "📋 Copiato negli appunti!";
        }
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h1 id="titolo">Caricamento...</h1>
    <p id="spiegazione">Sto leggendo la curiosità del giorno...</p>

    <!-- Pulsante Notifiche -->
    <button class="btn" onclick="attivaNotifiche()">🔔 Abilita Notifiche Push</button>

    <!-- Sezione Reazioni & Meme -->
    <div class="reactions">
      <button class="meme-btn" onclick="reazioneMeme('mindblown')">🤯 Mind Blown</button>
      <button class="meme-btn" onclick="reazioneMeme('doubt')">🤨 X to Doubt</button>
      <button class="meme-btn" onclick="reazioneMeme('share')">📲 Condividi</button>
    </div>
    <div id="reaction-msg"></div>
  </div>

  <script>
    fetch('curiosita.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('titolo').innerText = data.titolo;
        document.getElementById('spiegazione').innerText = data.spiegazione;
      })
      .catch(() => {
        document.getElementById('titolo').innerText = "Errore di caricamento";
      });
  </script>

</body>
</html>
