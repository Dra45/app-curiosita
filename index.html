<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curiosità & Almanacco del Giorno</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --accent-color: #38bdf8;
      --btn-bg: #0284c7;
      --btn-active: #0369a1;
      --water-btn-bg: #0284c7;
      --water-btn-border: #38bdf8;
      --meme-btn-bg: #334155;
      --calendar-btn-bg: #8b5cf6;
      --calendar-btn-border: #a78bfa;
    }

    body.pink-theme {
      --bg-color: #2a0f1d;
      --card-bg: #3b1e2e;
      --border-color: #553346;
      --text-main: #fcf8fa;
      --text-sub: #e1cbd7;
      --accent-color: #f472b6;
      --btn-bg: #db2777;
      --btn-active: #be185d;
      --water-btn-bg: #db2777;
      --water-btn-border: #f472b6;
      --meme-btn-bg: #553346;
      --calendar-btn-bg: #ec4899;
      --calendar-btn-border: #f472b6;
    }

    body.water-transform {
      background-color: #0284c7 !important;
      transition: background-color 0.5s ease-in-out;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      transition: background-color 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      text-align: center;
      transition: background-color 0.3s ease, border-color 0.3s ease, opacity 0.4s ease;
    }

    h1 { font-size: 1.4rem; color: var(--accent-color); margin-top: 0; transition: color 0.3s ease; }
    p { font-size: 1rem; line-height: 1.6; color: var(--text-sub); transition: color 0.3s ease; }
    
    .btn {
      background-color: var(--btn-bg);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); background-color: var(--btn-active); }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .btn-water {
      background-color: var(--water-btn-bg);
      color: white;
      border: 1px solid var(--water-btn-border);
    }

    .btn-calendar {
      background-color: var(--calendar-btn-bg);
      color: white;
      border: 1px solid var(--calendar-btn-border);
    }

    .reactions {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }
    .meme-btn {
      background: var(--meme-btn-bg);
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }
    .meme-btn:active { transform: scale(0.95); }
    #status-msg { font-size: 0.85rem; color: var(--accent-color); margin-top: 15px; min-height: 20px; word-break: break-all; }

    /* Box Almanacco Dinamico */
    .today-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px dashed var(--border-color);
      text-align: left;
      font-size: 0.9rem;
    }
    .today-box h3 { color: var(--accent-color); margin-top: 0; font-size: 1rem; }
    .today-box ul { padding-left: 20px; margin-bottom: 0; }
    .today-box li { margin-bottom: 8px; line-height: 1.4; }
    
    .day-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .day-btn {
      flex: 1;
      padding: 8px;
      background: var(--meme-btn-bg);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .day-btn.active {
      background: var(--btn-bg);
      border-color: var(--accent-color);
    }
  </style>

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "01c492a8-d8d7-4650-adef-f22d1322b577",
        safari_web_id: "web.onesignal.auto.45da02f8-0e2a-491b-9d85-c6fbaf55a283",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
      });

      if (OneSignal.User.PushSubscription.optedIn) {
        document.getElementById('status-msg').innerText = "✅ Notifiche attive!";
      }
    });

    async function attivaNotifiche() {
      const msg = document.getElementById('status-msg');
      msg.innerText = "⏳ Richiesta permessi...";

      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();
          await OneSignal.User.PushSubscription.optIn();
          
          setTimeout(() => {
            const subId = OneSignal.User.PushSubscription.id;
            if (subId) {
              msg.innerText = "🚀 Dispositivo Registrato!";
            } else {
              msg.innerText = "✅ Permesso accordato!";
            }
          }, 1000);
        } catch (err) {
          msg.innerText = "❌ Errore: " + err.message;
        }
      });
    }

    function provaNotifica() {
      const msg = document.getElementById('status-msg');
      OneSignalDeferred.push(function(OneSignal) {
        if (!OneSignal.User.PushSubscription.optedIn) {
          alert("Prima premi 'Abilita Notifiche Push'!");
          return;
        }

        msg.innerText = "⏳ In arrivo: Blocca lo schermo!";
        
        setTimeout(async () => {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.ready;
            reg.showNotification("💡 Curiosità del Giorno", {
              body: "Notifica Push di prova ricevuta!",
              icon: "icon-192.png",
              badge: "icon-192.png",
              vibrate: [200, 100, 200]
            });
            msg.innerText = "✅ Notifica inviata!";
          }
        }, 3000);
      });
    }

    const mesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

    // Aggiorna l'etichetta del pulsante con il giorno corrente
    function aggiornaTestoPulsante() {
      const oggi = new Date();
      const g = oggi.getDate();
      const m = mesi[oggi.getMonth()];
      const btn = document.getElementById('btn-almanacco');
      if (btn) {
        btn.innerText = `🗓️ Almanacco di Oggi (${g} ${m})`;
      }
    }

    let giornoSelezionato = 'oggi';

    function toggleAlmanacco() {
      const box = document.getElementById('today-box');
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
        caricaDatiAlmanacco(giornoSelezionato);
      }
    }

    async function caricaDatiAlmanacco(tipo) {
      giornoSelezionato = tipo;
      const box = document.getElementById('today-box');
      
      let dataRiferimento = new Date();
      if (tipo === 'ieri') {
        dataRiferimento.setDate(dataRiferimento.getDate() - 1);
      }

      const g = dataRiferimento.getDate();
      const mIndex = dataRiferimento.getMonth();
      const mNome = mesi[mIndex];
      const mm = String(mIndex + 1).padStart(2, '0');
      const gg = String(g).padStart(2, '0');

      box.innerHTML = `
        <div class="day-selector">
          <button class="day-btn ${tipo === 'ieri' ? 'active' : ''}" onclick="caricaDatiAlmanacco('ieri')">⬅️ Ieri</button>
          <button class="day-btn ${tipo === 'oggi' ? 'active' : ''}" onclick="caricaDatiAlmanacco('oggi')">📌 Oggi (${g} ${mNome})</button>
        </div>
        <p>⏳ Recupero eventi storici e santo del giorno...</p>
      `;

      try {
        const wikiRes = await fetch(`https://it.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${gg}`);
        const wikiData = await wikiRes.json();

        let htmlContent = `
          <div class="day-selector">
            <button class="day-btn ${tipo === 'ieri' ? 'active' : ''}" onclick="caricaDatiAlmanacco('ieri')">⬅️ Ieri</button>
            <button class="day-btn ${tipo === 'oggi' ? 'active' : ''}" onclick="caricaDatiAlmanacco('oggi')">📌 Oggi (${g} ${mNome})</button>
          </div>
          <h3>📅 Storico del ${g} ${mNome}</h3>
        `;

        if (wikiData.selected && wikiData.selected.length > 0) {
          htmlContent += "<ul>";
          wikiData.selected.slice(0, 4).forEach(item => {
            htmlContent += `<li><strong>${item.year}:</strong> ${item.text}</li>`;
          });
          htmlContent += "</ul>";
        } else {
          htmlContent += "<p>Nessun evento registrato per questa data.</p>";
        }

        htmlContent += `<p style="margin-top:10px; border-top:1px solid var(--border-color); padding-top:8px;"><strong>😇 Ricorrenza:</strong> Consulta le notizie del ${g} ${mNome}.</p>`;

        box.innerHTML = htmlContent;
      } catch (err) {
        box.innerHTML = "<p>❌ Impossibile recuperare i dati al momento.</p>";
      }
    }

    function vaiAdIdratazione() {
      document.body.classList.add('water-transform');
      const card = document.querySelector('.card');
      card.style.opacity = '0';
      setTimeout(() => { window.location.href = 'idratazione.html'; }, 400);
    }

    function cambiaTema() {
      document.body.classList.toggle('pink-theme');
      localStorage.setItem('theme', document.body.classList.contains('pink-theme') ? 'pink' : 'blue');
    }

    function reazioneMeme(tipo) {
      const msg = document.getElementById('status-msg');
      if (tipo === 'mindblown') msg.innerText = "🤯 Cervello esploso!";
      if (tipo === 'share') {
        if (navigator.share) {
          navigator.share({
            title: 'Curiosità del giorno',
            text: document.getElementById('titolo').innerText + " - " + document.getElementById('spiegazione').innerText,
            url: window.location.href
          });
        } else {
          navigator.clipboard.writeText(document.getElementById('titolo').innerText + ": " + document.getElementById('spiegazione').innerText);
          msg.innerText = "📋 Copiato negli appunti!";
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'pink') document.body.classList.add('pink-theme');
      aggiornaTestoPulsante();
    });
  </script>
</head>
<body>

  <div class="card">
    <h1 id="titolo">Caricamento...</h1>
    <p id="spiegazione">Sto leggendo la curiosità del giorno...</p>

    <button id="btn-almanacco" class="btn btn-calendar" onclick="toggleAlmanacco()">🗓️ Almanacco di Oggi</button>
    <div id="today-box" class="today-box"></div>

    <button class="btn" onclick="attivaNotifiche()">🔔 Abilita Notifiche Push</button>
    <button class="btn btn-secondary" onclick="provaNotifica()">🧪 Prova Notifica</button>
    <button class="btn btn-water" onclick="vaiAdIdratazione()" style="margin-top: 15px;">🍼 Ricordati di Bere (Idratazione)</button>
    <button class="btn btn-secondary" onclick="cambiaTema()" style="margin-top: 10px;">🎨 Cambia Tema (Rosa/Blu)</button>

    <div class="reactions">
      <button class="meme-btn" onclick="reazioneMeme('mindblown')">🤯 Mind Blown</button>
      <button class="meme-btn" onclick="reazioneMeme('share')">📲 Condividi</button>
    </div>
    <div id="status-msg"></div>
  </div>

  <script>
    fetch('curiosita.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('titolo').innerText = data.titolo;
        document.getElementById('spiegazione').innerText = data.spiegazione;
      })
      .catch(() => { document.getElementById('titolo').innerText = "Errore di caricamento"; });
  </script>

</body>
</html>
