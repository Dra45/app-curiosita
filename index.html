<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curiosità del Giorno</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 1.5rem;
      color: #38bdf8;
      margin-top: 0;
      margin-bottom: 15px;
      line-height: 1.3;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="titolo">Caricamento...</h1>
    <p id="spiegazione">Sto leggendo la nuova curiosità...</p>
  </div>

  <script>
    // Recupera curiosita.json aggiungendo il timestamp per evitare che il browser mantenga la versione vecchia in cache
    fetch('curiosita.json?t=' + new Date().getTime())
      .then(response => {
        if (!response.ok) {
          throw new Error('Errore di rete durante la lettura del file');
        }
        return response.json();
      })
      .then(data => {
        document.getElementById('titolo').innerText = data.titolo;
        document.getElementById('spiegazione').innerText = data.spiegazione;
      })
      .catch(error => {
        console.error("Errore nel caricamento:", error);
        document.getElementById('titolo').innerText = "Impossibile caricare la curiosità";
        document.getElementById('spiegazione').innerText = "Verifica la connessione internet o controlla che il file curiosita.json sia generato correttamente.";
      });
  </script>

</body>
</html>
